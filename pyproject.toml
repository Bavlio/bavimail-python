[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bavimail"
dynamic = ["version"]
description = "Python SDK for the Bavimail email service API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Bavlio" }, { name = "samcannas"} ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24.0,<1.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
    "uvicorn>=0.20.0,<1.0.0",
    "flask>=2.0",
    "fastapi>=0.100.0",
]
listener = ["uvicorn>=0.20.0,<1.0.0"]
flask = ["flask>=2.0"]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.20.0,<1.0.0"]
all = ["uvicorn>=0.20.0,<1.0.0", "flask>=2.0", "fastapi>=0.100.0"]

[project.urls]
Homepage = "https://github.com/Bavlio/bavimail-python"
Documentation = "https://github.com/Bavlio/bavimail-python#readme"

[tool.hatch.version]
path = "src/bavimail/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bavimail"]

[tool.mypy]
strict = true
python_version = "3.9"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
